[project]
name = "okf-four-tools-agent"
version = "0.1.0"
description = "One agent, four kinds of knowing — verified figures, computed queries, retrieved prose, live news."
requires-python = ">=3.12"

# The AgentCore CodeZip build reads dependencies from here, not requirements.txt.
# Deliberately small: duckdb reads parquet natively (no pandas, no pyarrow) and retrieval over
# five markdown files is term matching (no sklearn). That is the difference between a ~40 MB
# package and a ~145 MB one.
dependencies = [
  "bedrock-agentcore>=1.9.1",
  "strands-agents>=1.15.0",
  "duckdb>=1.5",
  "pyyaml>=6.0",
  "boto3>=1.35",
]
